<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Orrery · demo</title>
	<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
	<style>
		:root { --sun: #FF4F1A; --ink: #121214; --body: #5C5C63; --paper: #FFFFFF; --sheet: #F6F6F4; --rule: #E8E7E3; }
		html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: 'Inter Tight', system-ui, sans-serif; overflow: hidden; }
		#app { position: fixed; inset: 0; }
		header { position: fixed; top: 24px; left: 28px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
		header img { width: 30px; height: 30px; }
		header b { font-family: Urbanist, sans-serif; font-size: 26px; letter-spacing: -0.03em; }
		header span { font-size: 13px; color: var(--body); margin-left: 6px; }
		header em { font-style: normal; font: 600 11px 'Inter Tight', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--sun); background: #FFE9E1; padding: 4px 8px; border-radius: 999px; }
		#panel { position: fixed; left: 28px; bottom: 28px; width: 300px; background: var(--paper); border: 1px solid var(--rule); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 40px rgba(18,18,20,.08); }
		.eyebrow { font-size: 11px; letter-spacing: .12em; color: var(--sun); font-weight: 600; text-transform: uppercase; }
		#focus { font-family: Urbanist, sans-serif; font-size: 30px; line-height: 1; letter-spacing: -0.02em; }
		.stats { display: flex; gap: 20px; }
		.stats div { display: flex; flex-direction: column; gap: 2px; }
		.stats strong { font-family: Urbanist, sans-serif; font-size: 26px; }
		.stats small { font-size: 12px; color: var(--body); }
		.row { display: flex; gap: 8px; }
		button { flex: 1; font: 500 13px 'Inter Tight', sans-serif; padding: 10px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
		button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
		button:disabled { opacity: .4; cursor: default; }
		p { margin: 0; font-size: 13px; line-height: 19px; color: var(--body); }
		@media (max-width: 480px) { #panel { left: 16px; right: 16px; width: auto; bottom: 16px; } header { left: 16px; top: 16px; } }
	</style>
	<script type="importmap">
		{ "imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
			"three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			"orreryjs": "../packages/core/src/index.js",
			"@orreryjs/devtools": "../packages/devtools/src/index.js"
		} }
	</script>
</head>
<body>
	<div id="app"></div>
	<header><img src="../brand/mark.svg" alt="" /><b>orrery</b><span>demo · three r184</span><em id="backend">…</em></header>
	<div id="panel">
		<div class="eyebrow">Click a planet</div>
		<div id="focus">Sun</div>
		<div class="stats">
			<div><strong id="planets">0</strong><small>planets</small></div>
			<div><strong id="geo">0</strong><small>geometries</small></div>
			<div><strong id="tex">0</strong><small>textures</small></div>
		</div>
		<div class="row"><button id="add" class="primary">Add planet</button><button id="remove">Remove last</button></div>
		<div class="row"><button id="belt">Instance the belt</button></div>
		<button id="dev" style="flex:none">Open devtools  ·  press `</button>
		<p>Remove uses <b>world.remove()</b>, which also frees GPU memory. Watch the geometry count drop.</p>
	</div>

	<script type="module">
		import { DodecahedronGeometry, SRGBColorSpace, CanvasTexture, Group, Mesh, MeshBasicMaterial, MeshStandardMaterial, RingGeometry, SphereGeometry, DoubleSide } from 'three';
		import { World, addOrbitControls } from 'orreryjs';
		import { mountDevtools } from '@orreryjs/devtools';

		const forced = new URLSearchParams( location.search ).get( 'renderer' ); // ?renderer=webgl | webgl2
		const world = await World.create( { container: document.querySelector( '#app' ), renderer: forced ?? 'auto', adaptive: true } );
		document.querySelector( '#backend' ).textContent = { webgpu: 'WebGPU', webgl2: 'WebGL 2 fallback', webgl: 'WebGL' }[ world.backend ];
		world.scene.background = null;
		world.renderer.setClearColor( 0xffffff, 0 ); // transparent: the white page shows through, untouched by tone mapping
		world.camera.position.set( 0, 8, 15 );
		world.camera.lookAt( 0, 0, 0 );
		await addOrbitControls( world, { enableDamping: true } );

		const sun = new Mesh( new SphereGeometry( 1.1, 48, 32 ), new MeshStandardMaterial( { color: 0xff4f1a, emissive: 0xff4f1a, emissiveIntensity: 0.25, roughness: 0.5 } ) );
		sun.name = 'Sun';
		world.add( sun );

		const COLORS = [ 0x121214, 0x5c5c63, 0xff8a5c, 0x2b2b30, 0xb9b9c0, 0xff4f1a, 0x3a3a40, 0x8a8a90 ];
		const NAMES = [ 'Kepler', 'Halley', 'Vesta', 'Ceres', 'Juno', 'Pallas', 'Hygiea', 'Astraea' ];
		const planets = [];
		const focusEl = document.querySelector( '#focus' );

		function stripeTexture( hex ) {
			const c = document.createElement( 'canvas' ); c.width = 64; c.height = 32;
			const g = c.getContext( '2d' );
			g.fillStyle = '#' + hex.toString( 16 ).padStart( 6, '0' ); g.fillRect( 0, 0, 64, 32 );
			g.fillStyle = 'rgba(255,255,255,.18)'; for ( let y = 0; y < 32; y += 8 ) g.fillRect( 0, y, 64, 3 );
			const t = new CanvasTexture( c ); t.colorSpace = SRGBColorSpace; return t;
		}

		function addPlanet() {
			const i = planets.length;
			if ( i >= NAMES.length ) return;
			const radius = 2.4 + i * 1.15;
			const system = new Group();
			system.name = NAMES[ i ] + ' system';
			const orbit = new Mesh( new RingGeometry( radius - 0.012, radius + 0.012, 128 ), new MeshBasicMaterial( { color: 0x121214, transparent: true, opacity: 0.25, side: DoubleSide } ) );
			orbit.name = 'orbit';
			orbit.rotation.x = - Math.PI / 2;
			const size = 0.22 + ( i % 3 ) * 0.09;
			const planet = new Mesh( new SphereGeometry( size, 32, 16 ), new MeshStandardMaterial( { map: stripeTexture( COLORS[ i ] ), roughness: 0.6 } ) );
			planet.name = NAMES[ i ];
			planet.position.x = radius;
			system.add( orbit, planet );
			system.userData = { speed: 0.9 / Math.sqrt( radius ), angle: Math.random() * Math.PI * 2 };
			system.rotation.y = system.userData.angle;
			world.add( system );

			world.on( planet, 'pointerenter', () => planet.scale.setScalar( 1.35 ) );
			world.on( planet, 'pointerleave', () => planet.scale.setScalar( 1 ) );
			world.on( planet, 'click', () => { focusEl.textContent = planet.name; } );
			planets.push( system );
			refresh();
		}

		function removePlanet() {
			const system = planets.pop();
			if ( ! system ) return;
			if ( focusEl.textContent === system.children[ 1 ].name ) focusEl.textContent = 'Sun';
			world.remove( system );
			refresh();
		}

		function refresh() {
			// renderer.info updates on the next frame; read after it renders
			requestAnimationFrame( () => requestAnimationFrame( () => {
				const m = world.renderer.info.memory;
				document.querySelector( '#planets' ).textContent = planets.length;
				document.querySelector( '#geo' ).textContent = m.geometries;
				document.querySelector( '#tex' ).textContent = m.textures;
				document.querySelector( '#add' ).disabled = planets.length >= NAMES.length;
				document.querySelector( '#remove' ).disabled = planets.length === 0;
			} ) );
		}

		// Asteroid belt: 300 rocks sharing one geometry and material, so they
		// are perfect for world.optimize() (300 draw calls -> 1).
		const belt = new Group();
		belt.name = 'Asteroid belt';
		const rockGeo = new DodecahedronGeometry( 0.045, 0 );
		const rockMat = new MeshStandardMaterial( { color: 0x8a8a90, roughness: 0.9, flatShading: true } );
		for ( let i = 0; i < 300; i ++ ) {
			const a = Math.random() * Math.PI * 2, r = 4.12 + ( Math.random() - 0.5 ) * 0.55;
			const rock = new Mesh( rockGeo, rockMat );
			rock.name = 'rock';
			rock.position.set( Math.cos( a ) * r, ( Math.random() - 0.5 ) * 0.25, Math.sin( a ) * r );
			rock.rotation.set( Math.random() * 3, Math.random() * 3, 0 );
			rock.scale.setScalar( 0.6 + Math.random() * 0.9 );
			belt.add( rock );
		}
		world.add( belt );
		const beltBtn = document.querySelector( '#belt' );
		beltBtn.onclick = () => {
			const report = world.optimize( belt );
			beltBtn.textContent = `Instanced: ${ report.drawCallsSaved } draw calls saved`;
			beltBtn.disabled = true;
			refresh();
		};

		world.on( sun, 'click', () => { focusEl.textContent = 'Sun'; } );
		document.querySelector( '#add' ).onclick = addPlanet;
		document.querySelector( '#remove' ).onclick = removePlanet;
		for ( let i = 0; i < 5; i ++ ) addPlanet();

		world.onUpdate( ( dt ) => {
			sun.rotation.y += dt * 0.2;
			for ( const s of planets ) s.rotation.y += dt * s.userData.speed;
			belt.rotation.y += dt * 0.03;
		} );
		world.start();
		const devtools = mountDevtools( world, { open: new URLSearchParams( location.search ).has( 'devtools' ) } );
		const devBtn = document.querySelector( '#dev' );
		const syncDevBtn = () => { devBtn.textContent = devtools.el.hidden ? 'Open devtools  ·  press `' : 'Close devtools  ·  press `'; };
		devBtn.onclick = () => { devtools.toggle(); syncDevBtn(); };
		window.addEventListener( 'keydown', ( e ) => { if ( e.key === '`' ) setTimeout( syncDevBtn ); } );
		syncDevBtn();
		window.devtools = devtools;
		window.world = world; // for debugging in the console
	</script>
</body>
</html>
